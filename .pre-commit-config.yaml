---
exclude: "\\.terraform"
repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.108.0
    hooks:
      - id: terraform_docs
        always_run: true
      - id: terraform_fmt
      - id: terraform_validate
        args:
          - --hook-config=--retry-once-with-cleanup=true
        exclude: examples/
      - id: terraform_tflint
        alias: terraform_tflint_nocreds
        name: terraform_tflint_nocreds
        exclude: examples/
      - id: terraform_trivy
        args:
          - --args=--skip-dirs="**/.terraform,examples/*"
          # Do not scan vendored/downloaded child modules (only the shared
          # rhythmictech/tags module, which declares no resources): we do not
          # own their resource posture. Our own resources are still scanned, and
          # the dedicated CI trivy job gates CRITICAL/HIGH.
          - --args=--tf-exclude-downloaded-modules
      - id: terraform_providers_lock
        args:
          - --hook-config=--mode=always-regenerate-lockfile
          - --args=-platform=linux_amd64
          - --args=-platform=darwin_amd64
          - --args=-platform=darwin_arm64
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
        args:
          - --unsafe
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: no-commit-to-branch
        args:
          - --branch
          - main
          - --branch
          - master
          - --branch
          - prod
      - id: pretty-format-json
        args:
          - --autofix
          - --top-keys=name,Name
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=md
        exclude: README.md
ci:
  skip: [terraform_docs, terraform_fmt, terraform_tflint, terraform_trivy, terraform_providers_lock]
